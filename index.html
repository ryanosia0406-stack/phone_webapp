<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drone Watch</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000; /* True black for OLED power saving */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 100%;
            padding: 5px;
            text-align: center;
        }
        h1 { font-size: 16px; margin: 5px 0; color: #4ecca3; }
        
        .status-box {
            background: #16213e;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            border-left: 3px solid #4ecca3;
        }
        .mode-text { font-weight: bold; color: #4ecca3; }
        
        button {
            width: 100%;
            padding: 10px;
            margin: 4px 0;
            border: none;
            border-radius: 20px; /* Pill shape looks more native on watchOS */
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-summon { background-color: #4ecca3; color: #000; }
        .btn-follow { background-color: #3498db; color: white; }
        .btn-stop { background-color: #e74c3c; color: white; }
        
        button:disabled { opacity: 0.3; }

        #coords { font-size: 10px; color: #95a5a6; margin-top: 4px; }
        #network-status { font-size: 10px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Drone Control</h1>
        
        <div class="status-box">
            <span id="current-mode" class="mode-text">IDLE</span>
            <div id="coords">Lat: -- | Lon: --</div>
        </div>

        <button class="btn-summon" onclick="summonDrone()">Summon</button>
        <button class="btn-follow" id="follow-btn" onclick="startFollowMe()">Follow</button>
        <button class="btn-stop" id="stop-btn" onclick="stopFollowMe()" style="display:none;">Stop</button>

        <p id="network-status"></p>
    </div>

    <script>
        const NGROK_URL = "https://mothiest-aecial-hollie.ngrok-free.dev/location";
        const modeDisplay = document.getElementById('current-mode');
        const coordDisplay = document.getElementById('coords');
        const networkStatus = document.getElementById('network-status');
        const followBtn = document.getElementById('follow-btn');
        const stopBtn = document.getElementById('stop-btn');

        let watchId = null;

        function postToDrone(lat, lon, modeName) {
            coordDisplay.innerText = `Lat: ${lat.toFixed(5)} | Lon: ${lon.toFixed(5)}`;

            fetch(NGROK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    latitude: lat,
                    longitude: lon,
                    mode: modeName
                })
            })
            .then(() => {
                networkStatus.innerText = "Synced";
                networkStatus.style.color = "#4ecca3";
            })
            .catch(err => {
                networkStatus.innerText = "Sync Error";
                networkStatus.style.color = "#e74c3c";
            });
        }

        function summonDrone() {
            modeDisplay.innerText = "SUMMONING";
            navigator.geolocation.getCurrentPosition((pos) => {
                postToDrone(pos.coords.latitude, pos.coords.longitude, "SUMMON");
            });
        }

        function startFollowMe() {
            if (watchId) return;

            modeDisplay.innerText = "FOLLOWING";
            followBtn.style.display = "none";
            stopBtn.style.display = "block";

            // watchPosition is better for battery and works natively with GPS hardware
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    postToDrone(pos.coords.latitude, pos.coords.longitude, "FOLLOW_WATCH");
                },
                (err) => { networkStatus.innerText = "GPS Error"; },
                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 5000
                }
            );
        }

        function stopFollowMe() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            modeDisplay.innerText = "IDLE";
            followBtn.style.display = "block";
            stopBtn.style.display = "none";
            networkStatus.innerText = "Stopped";
        }
    </script>
</body>
</html>
