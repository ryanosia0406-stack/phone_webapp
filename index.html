<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker</title>
</head>
<body>

    <h2>GPS to Ngrok Server</h2>
    <button onclick="getLocation()">Send My Location</button>
    <p id="status"></p>

    <script>
        const statusText = document.getElementById('status');
        const NGROK_URL = "https://mothiest-aecial-hollie.ngrok-free.dev/location";

        function getLocation() {
            if (navigator.geolocation) {
                statusText.innerText = "Locating...";
                navigator.geolocation.getCurrentPosition(sendPosition, handleError);
            } else {
                statusText.innerText = "Geolocation is not supported by this browser.";
            }
        }

        function sendPosition(position) {
            const data = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude
            };

            statusText.innerText = `Sending: ${data.latitude}, ${data.longitude}`;

            fetch(NGROK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                console.log('Success:', result);
                statusText.innerText = "Location sent successfully!";
            })
            .catch(error => {
                console.error('Error:', error);
                statusText.innerText = "Error sending location. Check console.";
            });
        }

        function handleError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    statusText.innerText = "User denied the request for Geolocation.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    statusText.innerText = "Location information is unavailable.";
                    break;
                case error.TIMEOUT:
                    statusText.innerText = "The request to get user location timed out.";
                    break;
                case error.UNKNOWN_ERROR:
                    statusText.innerText = "An unknown error occurred.";
                    break;
            }
        }
    </script>
</body>
</html>
